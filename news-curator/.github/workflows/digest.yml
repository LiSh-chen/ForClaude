name: Send news digest

on:
  schedule:
    - cron: "0 0 * * 1,4"   # 週一、週四 08:00 (台北時間)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只評分不寄信"
        type: boolean
        default: true

permissions:
  contents: write   # 要把 data/seen.json 寫回 repo

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_SUBSCRIBERS: ${{ secrets.NEWS_SUBSCRIBERS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python -m curator run ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      - name: Commit sent-history
        run: |
          git config user.name "news-curator"; git config user.email "actions@users.noreply.github.com"
          git add data/seen.json || true
          git diff --cached --quiet || (git commit -m "chore: update sent history" && git push)
