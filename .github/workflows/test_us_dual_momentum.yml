name: Test US Dual Momentum (Trend-Filtered) vs QQQ

# 手動觸發：在存活者偏差修正後，純動量選股策略的優勢大幅縮水、樣本外驗證
# 甚至已經輸給 QQQ 買進持有（見 docs/research_findings.md 第10.5節
# 「2026-09-18 更新」）。這裡加一層 QQQ 自身趨勢濾網（絕對動能），測試能不能
# 把下檔風險壓低到真的打敗 QQQ 買進持有。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (regression guard)
        run: python -m pytest tests/ -q

      - name: Test dual momentum (trend-filtered) vs QQQ
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/test_us_dual_momentum_from_db.py
