name: Explore Other Strategy Directions On Real Data

# 手動觸發：測試兩個結構上不同於「逐日找突破/反轉時機點」的方向——
# 月/季調倉動能因子組合、以及規格書策略 B（軋空異常突破）單獨測試。
# 不會寫回任何資料，純粹讀取 + 印出結果。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run other-directions comparison
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/explore_other_directions_from_db.py
