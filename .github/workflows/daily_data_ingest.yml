name: Daily TW Market Data Ingest

# 每個台股交易日收盤後執行一次，把最新的價量與融資券資料抓下來寫進資料庫。
# 這支 workflow 跑在 GitHub 自己的 runner 上，有正常的網際網路存取權，
# 不受 Claude Code 開發沙盒的網路白名單限制——這正是選它來做資料排程的原因。
#
# 需要的 GitHub Secrets（都是選填，沒設也能先用示範清單跑起來）：
#   FINMIND_TOKEN   FinMind API token
#   DATABASE_URL    雲端 Postgres 連線字串；沒設就退回本機 SQLite 並自動 commit 回 repo
# 需要的 GitHub Variables（選填）：
#   STOCK_UNIVERSE  逗號分隔的股票代號清單

on:
  schedule:
    # 14:30 Asia/Taipei（台股收盤後） = 06:30 UTC，週一到週五
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force_backfill:
        description: "忽略每檔股票現有資料，強制全部重新回填 3 年（用來修復中途被打斷、部分股票只有一小段資料的情況）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 全量回填（force_backfill=true）時，每檔股票約需 5-6 秒（execute_values
    # 修好之後的實測數字），150 檔規模大概要 15 分鐘；平常的每日增量同步
    # （只補幾天資料）遠遠用不到這個上限，這個數字只是給「股票清單變大 +
    # 剛好需要全量回填」這個最壞情況留安全邊際。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STOCK_UNIVERSE: ${{ vars.STOCK_UNIVERSE }}
          FORCE_BACKFILL: ${{ inputs.force_backfill }}
          # Python 對著非終端機輸出預設是整塊緩衝，print() 的內容可能一直
          # 卡在緩衝區直到程式正常結束才會寫進 log；如果這個 step 被外層
          # timeout-minutes 強制中止（SIGTERM），緩衝區內容就會整段消失，
          # 看起來像是「完全沒有任何輸出的卡住」，但實際上可能只是還在跑、
          # 只是我們看不到過程。設這個環境變數強制即時輸出，之後不管是真的
          # 卡住還是只是跑得慢，log 都看得到即時進度。
          PYTHONUNBUFFERED: "1"
        run: python scripts/ingest_daily_data.py

      - name: Show current data status
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/show_data_status.py

      - name: Determine storage mode
        id: storage
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DB_URL" ]; then
            echo "use_git_snapshot=false" >> "$GITHUB_OUTPUT"
          else
            echo "use_git_snapshot=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated local SQLite snapshot
        if: steps.storage.outputs.use_git_snapshot == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tw_market.db
          git diff --cached --quiet || git commit -m "chore: daily TW market data sync $(date -u +%F)"
          git push
