name: Run Backtest On Real Data

# 手動觸發：讀取 Neon（或本機 SQLite）裡累積的真實資料，跑正式回測、
# 大盤環境敏感度檢驗、WFA 滾動驗證，把結果印在 job log 裡。
# 不會寫回任何資料，純粹讀取 + 印出結果。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest (spec 預設參數)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_backtest_from_db.py

      - name: Run regime sensitivity grid (demo 寬鬆參數)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_sensitivity_test_from_db.py

      - name: Run walk-forward analysis (demo 寬鬆參數)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_wfa_from_db.py
