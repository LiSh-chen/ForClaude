name: Invest Journal Review

# 每週六：重新追蹤所有過往推薦的實際績效，產出週度檢討報告。
# 每月第一個週六：另外產出月度檢討，並在『樣本足夠』時把結論回饋到 config/params.json（因子權重、估值方法權重、目標價折減），
# 下一期每日日誌即採用新參數；每次變更都記在 config/params_history.json。

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      monthly:
        description: "同時產生月度檢討並嘗試回饋參數"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: invest-journal
  cancel-in-progress: false

jobs:
  review:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: invest-journal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: invest-journal/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m ijournal track
      - run: python -m ijournal review --period weekly
      - name: Monthly review + parameter feedback (manual)
        if: inputs.monthly
        run: python -m ijournal review --period monthly --tune
      - name: Monthly review on first Saturday of the month
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" -le 7 ]; then python -m ijournal review --period monthly --tune; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data journal reviews site config
          git diff --cached --quiet || git commit -m "journal: review $(date -u +%F)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push
