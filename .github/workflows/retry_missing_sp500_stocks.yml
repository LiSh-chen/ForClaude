name: Retry Missing S&P 500 Stocks (period=max)

# 手動觸發：對 backfill_removed_sp500_stocks.yml 仍查無資料的 320 檔股票，
# 改用 period="max"（要 yfinance 有的全部歷史，不指定 start/end 窗口）
# 重試一次，篩出「查詢窗口設錯」造成的假陰性（見
# scripts/retry_missing_sp500_stocks_from_db.py 檔頭的完整背景說明）。
# 會真的寫入 Parquet 快照（不是唯讀診斷），但是 upsert-based 合併，冪等，
# 可以安全重跑。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (regression guard)
        run: python -m pytest tests/ -q

      # scripts/retry_missing_sp500_stocks_from_db.py 直接合併寫回 Parquet
      # 快照，不經過 SQLite，不需要另外的「匯出」步驟。us_prices 可能被
      # 拆成多個 part 檔案（見 tw_quant/data_snapshot.py 檔頭說明），下面
      # 用 -A + glob 一併 git add。
      - name: Retry missing S&P 500 stocks with period=max
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/retry_missing_sp500_stocks_from_db.py

      - name: Commit US data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/us_prices_snapshot*.parquet data/us_index_membership_snapshot.parquet
          git diff --cached --quiet && exit 0
          git commit -m "chore: update US data snapshot after retrying missing S&P 500 stocks $(date -u +%F)"
          # 見 daily_data_ingest.yml 同一處的說明：push 被拒絕時 fetch +
          # rebase 重試幾次。
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected（第 $i 次），fetch + rebase 後重試..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((i * 3))
          done
          git push

      # 2026-09-30：這支 workflow 完全不碰 SQLite 了，沒有東西可 commit——
      # scripts/retry_missing_sp500_stocks_from_db.py 直接讀寫 Parquet
      # 快照，上面「Commit US data snapshot」那步就是唯一需要的持久化
      # 動作。
