name: Stock Derby Daily Build

# S&P 500 的每日股價由既有的 "Daily US Market Data Ingest" 寫進 data/us_prices_snapshot*.parquet；
# 它跑完後這個 workflow 接著：
#   1. fetch_extras.py  補抓「不在 S&P 500 快照裡」的 Nasdaq-100 成分股（yfinance → stock-derby/data/extra_prices.csv）
#   2. build_derby.py   重算賽馬報與賽事 → stock-derby/data/derby.json
#   3. commit 資料回 repo（GitHub 即資料庫），並發佈 stock-derby/ 到 GitHub Pages
# 需要在 repo Settings → Pages → Source 選 "GitHub Actions"。
# 手動執行 refresh_factors=true 可重跑因子研究（factor_study.py），重新挑選五大關鍵參數。

on:
  schedule:
    # 固定每天更新兩次（美東收盤後、隔天開盤前）。賽馬自己用 yfinance 補抓最近兩週的價格，
    # 不必等上游快照；第二次是為了撿到 Yahoo 較晚才定案的收盤資料。
    - cron: "30 23 * * 1-5"     # 23:30 UTC = 美東 19:30/18:30，收盤 3.5 小時後
    - cron: "30 12 * * 2-6"     # 12:30 UTC = 美東 08:30/07:30，隔天開盤前
  workflow_run:
    workflows: ["Daily US Market Data Ingest"]
    types: [completed]
  workflow_dispatch:
    inputs:
      refresh_factors:
        description: "重跑因子研究、重新挑選五大關鍵參數"
        type: boolean
        default: false
  push:
    paths: ["stock-derby/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-derby
  cancel-in-progress: false

jobs:
  build:
    # 只在預設分支上建置/發佈（workflow_run 與排程本來就只在預設分支觸發）
    if: github.ref_name == github.event.repository.default_branch && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-derby
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy pyarrow yfinance requests lxml
      - name: Refresh Nasdaq-100 list + recent prices (all tickers) + Nasdaq-100-only history
        run: python fetch_extras.py
      - name: Re-pick the five key factors
        if: inputs.refresh_factors
        run: python factor_study.py
      - name: Build race cards
        run: python build_derby.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: stock-derby data $(date -u +%F)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: stock-derby }
      - uses: actions/deploy-pages@v4
