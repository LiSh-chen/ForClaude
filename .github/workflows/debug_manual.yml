name: Debug Manual Trigger

# 一次性診斷用 workflow：手動觸發，跑 scripts/show_data_status.py，
# 把資料庫目前實際的內容印到 Actions log 裡，不碰抓取邏輯。

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/show_data_status.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
