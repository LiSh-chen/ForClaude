name: Debug Manual Trigger

# 一次性診斷用 workflow：手動觸發，跑 scripts/_debug_finmind.py，
# 把 FinMind 的真實回傳結構印到 Actions log 裡。診斷完應該把這個檔案
# 和 scripts/_debug_finmind.py 一起刪掉。

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/_debug_finmind.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
