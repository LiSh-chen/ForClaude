name: Backfill Removed S&P 500 Stocks

# 正式把 yfinance 抓得到的 74 檔被剔除 S&P 500 股票寫進 Parquet 快照
# （us_prices + us_index_membership 兩份），補齊存活者偏差修正的「被剔除」
# 半邊。會真的寫入快照（不是唯讀診斷），但是 upsert-based 合併，冪等，
# 可以安全重跑。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (regression guard)
        run: python -m pytest tests/ -q

      # scripts/backfill_removed_sp500_stocks.py 直接合併寫回 Parquet
      # 快照，不經過 SQLite，不需要另外的「匯出」步驟。
      - name: Backfill removed S&P 500 stocks
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/backfill_removed_sp500_stocks.py

      # us_prices 可能被 upsert_us_prices_snapshot 拆成多個 part 檔案（見
      # tw_quant/data_snapshot.py 檔頭說明），用 -A + glob 一併 git add，
      # 才會連同「part 檔案數變少時舊檔案被刪除」這個狀態一起 stage。
      - name: Commit US data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/us_prices_snapshot*.parquet data/us_index_membership_snapshot.parquet
          git diff --cached --quiet && exit 0
          git commit -m "chore: update US data snapshot after removed-stock backfill $(date -u +%F)"
          # 見 daily_data_ingest.yml 同一處的說明：push 被拒絕時 fetch +
          # rebase 重試幾次。
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected（第 $i 次），fetch + rebase 後重試..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((i * 3))
          done
          git push

      # 2026-09-30：這支 workflow 完全不碰 SQLite 了，沒有東西可 commit——
      # scripts/backfill_removed_sp500_stocks.py 直接讀寫 Parquet 快照，
      # 上面「Commit US data snapshot」那步就是唯一需要的持久化動作。
