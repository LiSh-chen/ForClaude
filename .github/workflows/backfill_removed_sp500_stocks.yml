name: Backfill Removed S&P 500 Stocks

# 正式把 yfinance 抓得到的 74 檔被剔除 S&P 500 股票寫進資料庫（us_prices +
# us_index_membership 兩張表），補齊存活者偏差修正的「被剔除」半邊。會真的
# 寫入資料庫（不是唯讀診斷），但是 upsert-based，冪等，可以安全重跑。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (regression guard)
        run: python -m pytest tests/ -q

      - name: Backfill removed S&P 500 stocks
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/backfill_removed_sp500_stocks.py

      # 見 us_daily_data_ingest.yml 同一個步驟的說明：把回填後的最新資料
      # 匯出成 Parquet 快照 commit 回 repo，策略腳本才能改讀本機檔案、
      # 不用再連資料庫整表撈一次。
      - name: Export US data snapshot for strategy scripts
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/export_us_data_snapshot.py

      # us_prices 可能被 export_us_snapshot 拆成多個 part 檔案（見
      # tw_quant/data_snapshot.py 檔頭說明），用 -A + glob 一併 git add，
      # 才會連同「part 檔案數變少時舊檔案被刪除」這個狀態一起 stage。
      - name: Commit US data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/us_prices_snapshot*.parquet data/us_index_membership_snapshot.parquet
          git diff --cached --quiet || git commit -m "chore: update US data snapshot after removed-stock backfill $(date -u +%F)"
          git push

      # 2026-09-30 新增：不再有共用的雲端 Postgres 幫忙在不同 ephemeral
      # runner 之間保留狀態（見 tw_quant/storage.py 開頭說明）——這支
      # workflow 寫入的 data/tw_market.db 只存在於這次 runner 本機，如果
      # 不 commit 回 repo，下次 us_daily_data_ingest.yml 從 repo 重新
      # checkout 出來的 tw_market.db 就不會有這次回填的資料，連帶讓下次
      # 匯出的 Parquet 快照把這次回填的 74 檔被剔除股票覆寫掉——等於做白工。
      - name: Commit updated local SQLite snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tw_market.db
          git diff --cached --quiet || git commit -m "chore: persist removed-S&P-500-stock backfill to SQLite $(date -u +%F)"
          git push
