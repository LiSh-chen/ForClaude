name: Backfill Removed S&P 500 Stocks

# 正式把 yfinance 抓得到的 74 檔被剔除 S&P 500 股票寫進資料庫（us_prices +
# us_index_membership 兩張表），補齊存活者偏差修正的「被剔除」半邊。會真的
# 寫入資料庫（不是唯讀診斷），但是 upsert-based，冪等，可以安全重跑。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (regression guard)
        run: python -m pytest tests/ -q

      - name: Backfill removed S&P 500 stocks
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/backfill_removed_sp500_stocks.py

      # 見 us_daily_data_ingest.yml 同一個步驟的說明：把回填後的最新資料
      # 匯出成 Parquet 快照 commit 回 repo，策略腳本才能改讀本機檔案、
      # 不用再連資料庫整表撈一次。
      - name: Export US data snapshot for strategy scripts
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/export_us_data_snapshot.py

      # us_prices 可能被 export_us_snapshot 拆成多個 part 檔案（見
      # tw_quant/data_snapshot.py 檔頭說明），用 -A + glob 一併 git add，
      # 才會連同「part 檔案數變少時舊檔案被刪除」這個狀態一起 stage。
      - name: Commit US data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/us_prices_snapshot*.parquet data/us_index_membership_snapshot.parquet
          git diff --cached --quiet && exit 0
          git commit -m "chore: update US data snapshot after removed-stock backfill $(date -u +%F)"
          # 見 daily_data_ingest.yml 同一處的說明：push 被拒絕時 fetch +
          # rebase 重試幾次。
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected（第 $i 次），fetch + rebase 後重試..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((i * 3))
          done
          git push

      # 2026-09-30：刻意不 commit data/tw_market.db。原本這裡擔心「不 commit
      # 回 repo，下次重新 checkout 出來的 SQLite 就沒有這次回填的資料」，
      # 但已經用更好的方式解決：scripts/backfill_removed_sp500_stocks.py
      # 開頭會先呼叫 seed_store_from_us_snapshot() 把上面剛 commit 的
      # Parquet 快照種回本機 SQLite，不需要靠 commit 原始 SQLite 檔案來
      # 保留狀態。而且這份 SQLite 種完歷史後會超過 100MB，commit 回 repo
      # 反而會被 GitHub 的單檔 push 上限擋下（見 us_daily_data_ingest.yml
      # 同一處的說明）。
