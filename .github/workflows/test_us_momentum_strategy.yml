name: Test US Momentum Strategy vs QQQ

# 手動觸發：測試「買最近報酬率最高的股票」動量策略，能不能打敗美股 QQQ
# 買進持有（見 docs/research_findings.md 第10.3節：RSI/布林通道均值回歸
# 策略雖然絕對報酬為正，但同期間遠遠輸給 QQQ 買進持有 93.58% 的總報酬）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (regression guard)
        run: python -m pytest tests/ -q

      - name: Test momentum strategy vs QQQ
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/test_us_momentum_strategy_from_db.py
