name: Debug QQQ Multi-Period Buy-and-Hold

# 一次性診斷：算 QQQ 在三段不同期間（完整8年/動量策略樣本外期間/2022熊市）
# 買進持有的表現，供對照動量策略跟 RSI/布林通道策略的回測結果。用完即刪。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compare against QQQ buy-and-hold across periods
        run: python scripts/debug_qqq_multi_period_buyhold.py
