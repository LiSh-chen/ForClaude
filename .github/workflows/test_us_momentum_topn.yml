name: Test US Momentum Top-N (Concentration) vs QQQ

# 手動觸發：QQQ 這幾年的漲幅集中在少數幾檔巨型科技/AI股，10.10 節的等權重
# 被動參照組也一樣打不過 QQQ。這裡測持股檔數（top_n）本身——更集中的動量
# 組合（3/5檔）能不能貼近 QQQ 這種極端集中的報酬曲線，範圍從 3 檔拉到 50 檔。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (regression guard)
        run: python -m pytest tests/ -q

      - name: Test momentum top-n grid
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/test_us_momentum_topn_from_db.py
