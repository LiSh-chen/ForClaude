name: Analyze Return Regularities On Real Data

# 手動觸發：用 rank IC 分析法全面掃描價格動量/相對量能/券資比這三種訊號
# 在不同觀察窗/預測窗組合下，跟未來報酬之間是否存在統計上站得住腳的規律。
# 不會寫回任何資料，純粹讀取 + 印出結果。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IC regularity scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/analyze_return_regularities_from_db.py
