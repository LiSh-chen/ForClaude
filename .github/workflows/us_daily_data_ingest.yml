name: Daily US Market Data Ingest

# 美股版的每日資料排程，抓 S&P 500 成分股的價量資料，寫進資料庫的
# us_prices 表格（跟台股的 prices 表格是獨立的，同一個資料庫互不干擾）。
# 用 yfinance，不需要 API token，也沒有 FinMind 那種「當日額度用完」的
# 限制。
#
# 2026-09-30：不再使用雲端 Postgres（Neon 免費額度被打滿，見
# tw_quant/storage.py 開頭說明）。一律寫本機 SQLite（data/tw_market.db），
# 每次執行完這個 workflow 自己 commit 回 repo——repo 本身就是唯一的資料
# 來源，不依賴任何外部服務。

on:
  schedule:
    # 16:30 America/New_York（美股收盤後） = 21:30 UTC（夏令時間；冬令時間
    # 差一小時，這裡先抓比較保守的時間，資料通常收盤後不久就更新了）
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_backfill:
        description: "忽略每檔股票現有資料，強制全部重新回填"
        type: boolean
        default: false
      backfill_years:
        description: "force_backfill=true 時，回填幾年歷史（預設 8；測 2008 金融風暴需要拉到 ~20）"
        type: string
        default: "8"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # S&P 500 有 500 檔，全量回填一次規模比台股 150 檔大很多，用比較長的
    # timeout 留安全邊際；平常的每日增量同步遠遠用不到這個上限。
    #
    # 45 分鐘曾經不夠用：force_backfill=true 抓 8 年歷史那次（見
    # docs/research_findings.md 第10.3節的樣本外驗證需求）在 45 分鐘
    # timeout 被砍掉，run #3（id 35324991527）卡在 in_progress 直到
    # timeout 強制 cancelled，8 年資料量每檔股票約 2000 個交易日（vs
    # 3 年版的 752 天），單檔抓取+寫入時間明顯變長，拉高到 90 分鐘。
    #
    # backfill_years=20（2026-09-20 為測 2008 金融風暴新增）資料量約是
    # 8 年版的 2.5 倍，比照同比例再留安全邊際，拉高到 300 分鐘；平常的
    # 每日增量同步跟預設 8 年版 force_backfill 都遠遠用不到這個上限。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run US ingestion
        env:
          FORCE_BACKFILL: ${{ inputs.force_backfill }}
          BACKFILL_YEARS: ${{ inputs.backfill_years || '8' }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/ingest_us_daily_data.py

      # 匯出成 commit 進 repo 的 Parquet 快照，讓策略回測腳本改讀本機檔案、
      # 不用每次都重新讀取整個 SQLite 檔案（見 tw_quant/data_snapshot.py
      # 的背景說明）。
      - name: Export US data snapshot for strategy scripts
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/export_us_data_snapshot.py

      # 注意（2026-09-20，backfill_years=20 那次觀察到）：資料量拉大到
      # 20 年時單一 us_prices_snapshot.parquet 會超過 101 MB，超過 GitHub
      # 單檔 100 MB push 上限，會被 pre-receive hook 擋下。已修正：
      # tw_quant/data_snapshot.py 的 export_us_snapshot 現在依列數自動把
      # us_prices 拆成多個檔案（第一份沿用原檔名，超過門檻的部分依序寫成
      # us_prices_snapshot.part2.parquet、part3.parquet……）。這裡用
      # -A + glob 一併 git add：資料量變小、part 檔案數變少時，export 那步
      # 會把多出來的舊 part 檔案從硬碟刪掉，-A 才會把這個刪除也一起
      # stage（純 git add 只會 stage 現存檔案，留下已刪除但 repo 裡還有的
      # 舊 part 檔案，讀取端 glob 進來就會變成重複資料）。
      - name: Commit US data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/us_prices_snapshot*.parquet data/us_index_membership_snapshot.parquet
          git diff --cached --quiet && exit 0
          git commit -m "chore: update US data snapshot for strategy scripts $(date -u +%F)"
          # 見 daily_data_ingest.yml 同一處的說明：沒有共用資料庫序列化
          # 寫入了，push 被拒絕時 fetch + rebase 重試幾次。
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected（第 $i 次），fetch + rebase 後重試..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((i * 3))
          done
          git push

      - name: Show current data status
        if: always()
        run: python scripts/show_data_status.py

      # 2026-09-30 刻意不 commit data/tw_market.db：ingest_us_daily_data.py
      # 開頭會先把 Parquet 快照整個種回這份本機 SQLite（見
      # tw_quant/data_snapshot.py 的 seed_store_from_us_snapshot），種完
      # 再加上台股共用的表格，整個檔案輕鬆超過 100MB（實測 108MB，被
      # GitHub 的 100MB 單檔 push 上限擋下）。上面「Commit US data
      # snapshot」那步的 Parquet 快照才是美股資料真正跨執行持久化的來源，
      # 這份本機 SQLite 純粹是這次執行用完即丟的工作檔案，不應該 commit。
