<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Derby 美股賽馬</title>
<style>
  :root { --bg:#f6f4ee; --fg:#1d2b1f; --track:#c9a66b; --track2:#bd9a5e; --grass:#4c8a4a; --card:#fffdf7; --muted:#6b7367; --up:#1a8f4c; --down:#d23b3b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181a; --fg:#e8ece6; --track:#7d6638; --track2:#725d33; --grass:#2f5a2e; --card:#1d2326; --muted:#98a39a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  button, select { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--muted); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--grass); color:#fff; border-color:var(--grass); }
  input[type=range] { flex:1; min-width:140px; }
  .date { font-variant-numeric:tabular-nums; font-weight:600; min-width:7em; }
  .track { background:var(--grass); border-radius:12px; padding:8px 0; position:relative; overflow:hidden; }
  .lane { position:relative; height:50px; margin:2px 0; background:var(--track); border-top:2px dashed rgba(255,255,255,.35); }
  .lane:nth-child(even) { background:var(--track2); }
  .name { position:absolute; left:8px; top:2px; font-size:12px; color:#fff; text-shadow:0 1px 2px #0008; z-index:2; pointer-events:none; }
  .horse { position:absolute; top:12px; left:0; transition:left .35s linear; font-size:28px; line-height:1; z-index:1; white-space:nowrap; }
  .horse .tag { display:inline-block; vertical-align:middle; font-size:11px; font-weight:700; color:#fff; padding:1px 6px; border-radius:10px; margin-left:4px; }
  .finish { position:absolute; right:12px; top:0; bottom:0; width:10px; z-index:1; background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/10px 10px; opacity:.85; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; margin-top:16px; }
  th, td { padding:8px 12px; text-align:right; border-bottom:1px solid rgba(128,128,128,.2); font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  .up { color:var(--up); } .down { color:var(--down); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  #msg { padding:24px; text-align:center; color:var(--muted); }
  footer { color:var(--muted); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>🏇 Stock Derby 美股賽馬</h1>
  <p class="sub">每匹馬代表一檔美股，跑得越前面代表賽程區間內累積漲幅越大。</p>

  <div class="controls">
    <label>賽程 <select id="window">
      <option value="5">近 5 個交易日</option>
      <option value="20" selected>近 20 個交易日</option>
      <option value="60">近 60 個交易日</option>
      <option value="0">全部資料</option>
    </select></label>
    <button id="play" class="primary">▶ 開跑</button>
    <button id="reset">⏮ 重來</button>
    <label>速度 <select id="speed"><option value="900">慢</option><option value="450" selected>中</option><option value="180">快</option></select></label>
  </div>
  <div class="controls">
    <span class="date" id="date"></span>
    <input type="range" id="scrub" min="0" max="0" value="0">
  </div>

  <div id="msg">載入資料中…</div>
  <div class="track" id="track" hidden></div>
  <table id="board" hidden>
    <thead><tr><th>名次</th><th>馬匹</th><th>收盤價</th><th>累積報酬</th><th>當日</th></tr></thead>
    <tbody></tbody>
  </table>
  <footer id="foot"></footer>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let racers = [], dates = [], prices = {}, days = [], idx = 0, timer = null;

async function load() {
  const [tk, csv] = await Promise.all([
    fetch("tickers.json").then(r => r.json()),
    fetch("data/prices.csv").then(r => r.text()),
  ]);
  racers = tk;
  const lines = csv.trim().split(/\r?\n/);
  const cols = lines[0].split(",").slice(1);
  dates = []; prices = Object.fromEntries(cols.map(c => [c, []]));
  for (const line of lines.slice(1)) {
    const f = line.split(",");
    dates.push(f[0]);
    cols.forEach((c, i) => prices[c].push(f[i + 1] === "" ? null : parseFloat(f[i + 1])));
  }
  racers = racers.filter(r => prices[r.ticker]);
}

// Position data for the chosen window: cumulative return vs. the window's first day.
function buildRace() {
  const n = +$("window").value;
  const start = n ? Math.max(0, dates.length - 1 - n) : 0;
  days = [];
  for (let d = start; d < dates.length; d++) {
    days.push({ date: dates[d], rows: racers.map(r => {
      const p = prices[r.ticker], base = firstValid(p, start), cur = p[d] ?? lastValid(p, d);
      const prev = d > start ? (p[d - 1] ?? cur) : cur;
      return { ...r, price: cur, ret: base ? cur / base - 1 : 0, day: prev ? cur / prev - 1 : 0 };
    }) });
  }
  let lo = 0, hi = 0;
  days.forEach(day => day.rows.forEach(r => { lo = Math.min(lo, r.ret); hi = Math.max(hi, r.ret); }));
  days.lo = lo; days.span = (hi - lo) || 1;
  $("scrub").max = days.length - 1;
  idx = 0;
  drawTrack();
  render();
}
const firstValid = (p, from) => { for (let i = from; i < p.length; i++) if (p[i] != null) return p[i]; };
const lastValid = (p, to) => { for (let i = to; i >= 0; i--) if (p[i] != null) return p[i]; };

function drawTrack() {
  $("track").innerHTML = racers.map(r =>
    `<div class="lane" data-t="${r.ticker}"><span class="name">${r.ticker} · ${r.horse}</span>` +
    `<div class="horse">🏇<span class="tag" style="background:${r.color}"></span></div></div>`).join("") + '<div class="finish"></div>';
}

const pct = v => (v >= 0 ? "+" : "") + (v * 100).toFixed(2) + "%";
const cls = v => v >= 0 ? "up" : "down";

function render() {
  const day = days[idx];
  $("date").textContent = day.date;
  $("scrub").value = idx;
  const laneW = $("track").clientWidth;
  const ranked = [...day.rows].sort((a, b) => b.ret - a.ret);
  for (const r of day.rows) {
    const lane = document.querySelector(`.lane[data-t="${r.ticker}"]`);
    const frac = (r.ret - days.lo) / days.span;           // 0 = worst ever in window, 1 = best ever
    const x = 8 + frac * (laneW - 8 - 90);
    const horse = lane.querySelector(".horse");
    horse.style.left = x + "px";
    horse.querySelector(".tag").textContent = pct(r.ret);
  }
  $("board").querySelector("tbody").innerHTML = ranked.map((r, i) =>
    `<tr><td>${idx === days.length - 1 && i === 0 ? "🏆" : i + 1}</td>` +
    `<td><span class="dot" style="background:${r.color}"></span>${r.ticker} <small>${r.horse}</small></td>` +
    `<td>$${r.price.toFixed(2)}</td><td class="${cls(r.ret)}">${pct(r.ret)}</td><td class="${cls(r.day)}">${pct(r.day)}</td></tr>`).join("");
}

function stop() { clearInterval(timer); timer = null; $("play").textContent = "▶ 開跑"; }
function play() {
  if (idx >= days.length - 1) idx = 0;
  $("play").textContent = "⏸ 暫停";
  timer = setInterval(() => {
    if (idx >= days.length - 1) return stop();
    idx++; render();
  }, +$("speed").value);
}

$("play").onclick = () => timer ? stop() : play();
$("reset").onclick = () => { stop(); idx = 0; render(); };
$("scrub").oninput = e => { stop(); idx = +e.target.value; render(); };
$("window").onchange = () => { stop(); buildRace(); };
$("speed").onchange = () => { if (timer) { stop(); play(); } };
window.addEventListener("resize", () => days.length && render());

load().then(() => {
  $("msg").hidden = true; $("track").hidden = false; $("board").hidden = false;
  $("foot").textContent = `資料：${dates[0]} ~ ${dates[dates.length - 1]}（每日由 GitHub Actions 自動更新）。僅供娛樂，非投資建議。`;
  buildRace();
}).catch(e => { $("msg").textContent = "資料載入失敗：" + e.message; });
</script>
</body>
</html>
