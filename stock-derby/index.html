<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Derby 美股賽馬</title>
<style>
  :root { --bg:#f6f4ee; --fg:#1d2b1f; --track:#c9a66b; --track2:#bd9a5e; --grass:#4c8a4a; --card:#fffdf7; --muted:#6b7367; --up:#1a8f4c; --down:#d23b3b; --line:rgba(128,128,128,.28); --gold:#d4a017; --accent:#2f6b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181a; --fg:#e8ece6; --track:#7d6638; --track2:#725d33; --grass:#2f5a2e; --card:#1d2326; --muted:#98a39a; --accent:#6fbf7a; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:10px 12px 24px; }
  h1 { margin:0; font-size:1.25rem; } h2 { font-size:1.05rem; margin:14px 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .tabs { display:flex; gap:4px; margin:8px 0; position:sticky; top:0; z-index:20; background:var(--bg); padding:4px 0; }
  .tabs button { flex:1; padding:7px 4px; border-radius:10px; font-weight:600; }
  .tabs button.on, .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:6px 0; }
  .seg { display:inline-flex; border:1px solid var(--muted); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line); padding:5px 9px; }
  .seg button:last-child { border-right:0; }
  button, select { font:inherit; padding:6px 12px; border:1px solid var(--muted); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--grass); color:#fff; border-color:var(--grass); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.i { padding:0 6px; border-radius:50%; font-size:12px; line-height:18px; margin-left:4px; color:var(--muted); }
  .tt { display:block; margin:4px 0; padding:6px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px; font-size:13px; color:var(--fg); }
  input[type=range] { flex:1; min-width:90px; }
  .date { font-variant-numeric:tabular-nums; font-weight:600; }
  .up { color:var(--up); } .down { color:var(--down); } .warn { color:#b45309; } @media (prefers-color-scheme: dark) { .warn { color:#fbbf24; } }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:8px 0; font-size:14px; }
  details.box summary { cursor:pointer; font-weight:600; } details.box > *:not(summary) { font-size:13px; }
  details.box ol, details.box ul { margin:6px 0 6px 18px; padding:0; }
  /* ---- track ---- */
  .trackwrap { background:var(--grass); border-radius:12px; padding:4px 0 6px; position:relative; overflow:hidden; margin-top:6px; }
  .tlabels { position:relative; height:16px; font-size:11px; color:#fff; font-weight:600; }
  .tlabels span { position:absolute; top:0; white-space:nowrap; text-shadow:0 1px 2px #0008; }
  #track { position:relative; }
  .lane { position:absolute; left:0; right:0; top:0; display:flex; height:var(--lane-h,50px); background:var(--track); transition:transform .45s ease; }
  .lane.alt { background:var(--track2); } .lane.nt { transition:none; }
  .gut { flex:none; width:var(--gut,74px); display:flex; flex-direction:column; justify-content:center; gap:1px; padding-left:4px; overflow:hidden; background:rgba(0,0,0,.28); color:#fff; font-size:11px; font-weight:600; text-shadow:0 1px 2px #0008; }
  .gl1 { display:flex; align-items:center; gap:3px; min-width:0; }
  .gl1 .rk { flex:none; min-width:16px; height:16px; border-radius:8px; background:#fff3; text-align:center; line-height:16px; font-size:11px; }
  .gl1 .sd { flex:none; min-width:15px; height:15px; border-radius:4px; text-align:center; line-height:15px; font-size:10px; font-style:normal; }
  .gl1 span { font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gl2 { font-size:10px; font-variant-numeric:tabular-nums; padding-left:2px; } .gut .up { color:#8ef0a8; } .gut .down { color:#ffa3aa; }
  .field { position:relative; flex:1; background-image:linear-gradient(90deg, rgba(255,255,255,.16) 0 2px, transparent 2px); background-size:36px 100%; background-position-x:var(--gx,0px); }
  .horse { position:absolute; top:2px; left:0; will-change:transform; z-index:2; display:flex; align-items:flex-end; }
  .horse .sprite { flex:none; image-rendering:pixelated; }
  .tag { position:absolute; left:100%; bottom:1px; margin-left:3px; font-size:10px; font-weight:700; color:#fff; padding:0 5px; border-radius:8px; white-space:nowrap; }
  .vline { position:absolute; top:0; bottom:0; width:3px; z-index:3; }
  .vline.finish { width:8px; background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/8px 8px; }
  .sprite.live { animation:gallop var(--spd,.55s) steps(6) infinite; }
  .cardsp .sprite { width:72px; height:54px; background-size:504px 54px; background-position:-432px 0; image-rendering:pixelated; }
  @keyframes gallop { from { background-position:0 0; } to { background-position:-432px 0; } }
  /* ---- tables ---- */
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; margin-top:8px; font-size:14px; }
  th, td { padding:5px 8px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align:left; }
  @media (max-width:560px) { .hide-narrow { display:none; } td, th { padding:4px 5px; font-size:13px; } main { padding:6px 8px 16px; } h1 { font-size:1.05rem; } .tabs { margin:4px 0; } .controls { margin:3px 0; } .box { margin:5px 0; padding:6px 10px; } }
  /* ---- race card ---- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin:8px 0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px; }
  .cardsp { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .no { min-width:34px; height:22px; border-radius:8px; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .head { display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; }
  .tk { font-size:1.1rem; font-weight:700; }
  .mark { font-size:1.2rem; color:var(--gold); font-weight:700; } .stars { color:var(--gold); letter-spacing:1px; }
  .body { grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:6px 18px; }
  .lbl { font-size:12px; color:var(--muted); }
  .chips { display:flex; gap:4px; margin:2px 0; }
  .chip { min-width:26px; text-align:center; padding:0 6px; border-radius:6px; background:var(--line); font-weight:600; }
  .chip.none { background:transparent; border:1px dashed var(--line); color:var(--muted); font-weight:400; }
  .chip.g1 { background:var(--gold); color:#fff; } .chip.g2 { background:#9aa3ab; color:#fff; } .chip.g3 { background:#b87333; color:#fff; }
  .badge { display:inline-block; padding:0 8px; border-radius:10px; background:var(--accent); color:#fff; font-size:13px; font-weight:600; }
  .arow { display:grid; grid-template-columns:76px 1fr 30px; gap:6px; align-items:center; font-size:13px; cursor:pointer; padding:1px 0; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
  .cmt { grid-column:1 / -1; font-size:13px; }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:3px; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .gc { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; font-size:13px; }
  .stage { background:var(--grass); border-radius:8px; display:flex; justify-content:center; padding:4px 0; }
  .stage .sprite { width:96px; height:72px; background-size:672px 72px; background-position:-576px 0; image-rendering:pixelated; }
  .gc:hover .sprite, .gc.on .sprite { animation:g2 .55s steps(6) infinite; }
  @keyframes g2 { from { background-position:0 0; } to { background-position:-576px 0; } }
  #msg { padding:24px; text-align:center; color:var(--muted); }
  footer { color:var(--muted); font-size:12px; margin:16px 0; }

  /* ---- betting page: odds board / bet slip / tickets ---- */
  .oddsboard { background:#0b1a12; color:#e7f5e9; border-radius:14px; padding:10px 10px 6px; margin:8px 0; border:2px solid #1c3a28; box-shadow:inset 0 0 24px #000a; }
  .ob-title { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; font-weight:700; letter-spacing:.5px; }
  .ob-title small { color:#8fb59a; font-weight:400; }
  .ob-status { margin-left:auto; padding:1px 10px; border-radius:10px; font-size:12px; font-weight:700; }
  .ob-status.open { background:#14532d; color:#86efac; } .ob-status.shut { background:#4c0519; color:#fda4af; }
  .oddsboard table { background:transparent; color:inherit; margin-top:6px; }
  .oddsboard th { color:#8fb59a; font-weight:500; font-size:12px; border-bottom:1px solid #1c3a28; }
  .oddsboard td { border-bottom:1px solid #12301f; }
  .saddle { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; color:#fff; font-weight:800; font-size:14px; box-shadow:inset 0 -2px 0 #0004; }
  .betnote { margin:8px 0; padding:8px 12px; border-radius:10px; background:#fff1d6; color:#7a3e00; border:2px solid #f5a623; font-weight:600; font-size:14px; }
  .oddsboard .slip { margin:4px 0 8px; } .oddsboard td.slipcell { padding:0 2px; }
  .led.shut { color:#6b7d70; text-shadow:none; }
  #persel label { display:flex; gap:6px; align-items:center; flex:1; min-width:0; } #perSel { flex:1; min-width:0; max-width:100%; }
  .led { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-weight:800; font-size:16px; color:#ffd84d; text-shadow:0 0 6px #ffb80088; background:#050d08; border:1px solid #29503a; border-radius:6px; padding:3px 8px; min-width:58px; cursor:pointer; }
  .led:hover { border-color:#ffd84d; } .led.sel { background:#ffd84d; color:#1b1500; text-shadow:none; } .led[disabled] { color:#5b6b60; text-shadow:none; cursor:not-allowed; }
  .led small { display:block; font-size:10px; font-weight:400; color:#8fb59a; }
  .form-dots { letter-spacing:2px; color:#cfe9d6; font-size:12px; }
  .slip { position:relative; margin:12px 0; padding:12px 12px 10px; background:#fff7f2; color:#2a2320; border:1px solid #e3c9bd; border-radius:6px;
    background-image:repeating-linear-gradient(transparent 0 25px, #f0d4c8 25px 26px); box-shadow:0 2px 0 #e9cfc3, 0 8px 18px #0003; }
  .slip::before { content:""; position:absolute; left:0; right:0; top:0; height:8px; background:repeating-linear-gradient(90deg,#d6405a 0 10px,#fff7f2 10px 20px); border-radius:6px 6px 0 0; }
  .slip h3 { margin:8px 0 2px; font-size:1.05rem; letter-spacing:2px; display:flex; justify-content:space-between; align-items:baseline; }
  .slip h3 small { font-weight:400; letter-spacing:0; color:#8a6f64; font-size:12px; }
  .slip .step { margin:10px 0 4px; font-weight:700; font-size:13px; color:#b0314a; }
  .nbox { display:inline-flex; flex-direction:column; align-items:center; gap:2px; margin:2px; cursor:pointer; font-size:11px; color:#6b5a52; }
  .nbox i { width:34px; height:34px; border:2px solid #b0314a; border-radius:4px; background:#fff; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:800; font-size:16px; color:#b0314a; }
  .nbox.on i { background:#b0314a; color:#fff; } .nbox[disabled] { opacity:.4; }
  .types { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .typecard { border:2px solid #d9b8ab; border-radius:6px; padding:6px 8px; background:#fffdfb; cursor:pointer; font-size:13px; }
  .typecard b { display:block; font-size:15px; } .typecard.on { border-color:#b0314a; background:#ffe9ee; }
  .stakes { display:flex; flex-wrap:wrap; gap:6px; }
  .stakes button { background:#fff; border:2px solid #d9b8ab; color:#2a2320; font-weight:700; }
  .stakes button.on { background:#b0314a; border-color:#b0314a; color:#fff; }
  .slip .sum { display:flex; justify-content:space-between; gap:8px; margin-top:10px; padding-top:8px; border-top:2px dashed #c9a79a; font-size:14px; flex-wrap:wrap; }
  .slip .go { background:#b0314a; color:#fff; border:0; font-weight:800; letter-spacing:2px; padding:9px 20px; border-radius:4px; }
  .tickets { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin:8px 0; }
  .ticket { position:relative; font-family:"Courier New",ui-monospace,monospace; color:#222; font-size:13px; padding:12px 14px 12px; background:#fffef4; filter:drop-shadow(0 3px 5px #0004);
    -webkit-mask:radial-gradient(circle 6px at 0 18px,#0000 98%,#000) left/51% 36px repeat-y, radial-gradient(circle 6px at 100% 18px,#0000 98%,#000) right/51% 36px repeat-y;
            mask:radial-gradient(circle 6px at 0 18px,#0000 98%,#000) left/51% 36px repeat-y, radial-gradient(circle 6px at 100% 18px,#0000 98%,#000) right/51% 36px repeat-y;
    background-image:linear-gradient(#0000000a,#0000 18px); }
  .ticket .th { text-align:center; font-weight:800; letter-spacing:3px; border-bottom:2px dashed #999; padding-bottom:6px; margin-bottom:6px; }
  .ticket .th small { display:block; font-weight:400; letter-spacing:0; font-size:10px; color:#777; }
  .ticket .r { display:flex; justify-content:space-between; gap:8px; } .ticket .r span:first-child { color:#666; }
  .ticket .pick { margin:8px 0; padding:6px 8px; border:2px solid #222; text-align:center; font-weight:800; font-size:15px; }
  .ticket .pick small { display:block; font-weight:400; font-size:11px; }
  .ticket svg { display:block; margin:8px auto 0; width:90%; height:34px; }
  .ticket .stamp { position:absolute; right:8px; bottom:62px; transform:rotate(-14deg); border:3px solid; border-radius:6px; padding:0 8px; font-weight:900; font-size:16px; letter-spacing:2px; opacity:.85; background:#fffef4cc; }
  .stamp.pending { color:#c27a00; } .stamp.won { color:#15803d; } .stamp.lost { color:#b91c1c; }
  .ticket.won { background:#f1fff1; } .ticket.lost { background:#f4f1ee; color:#555; }
</style>
</head>
<body>
<main>
  <h1>🏇 Stock Derby 美股賽馬</h1>
  <nav class="tabs" id="tabs"><button data-t="race">🏁 賽馬</button><button data-t="card">📋 馬報</button><button data-t="bet">🎟 下注</button></nav>
  <div id="msg">載入資料中…</div>
  <div id="app" hidden>
    <div class="controls" id="sel">
      <span class="seg" id="pool"><button data-v="spx">S&amp;P 500</button><button data-v="ndx">Nasdaq-100</button><button data-v="all">合併</button></span>
      <span class="seg" id="cyc"><button data-v="d">1天</button><button data-v="w">1週</button><button data-v="w2">2週</button><button data-v="m">1個月</button><button data-v="q">季</button><button data-v="h">半年</button></span>
    </div>
    <div class="controls" id="persel"><label>週期 <select id="perSel"></select></label></div>

    <section id="tab-race">
      <div id="rinfo"></div>
      <div class="controls"><button id="play" class="primary">⏸ 暫停</button><button id="replay">↺ 重播</button><button id="result" hidden>⏭ 直接看結果</button>
        <select id="speed"><option value="slow">慢</option><option value="mid" selected>中</option><option value="fast">快</option></select>
        <span class="date" id="date"></span><input type="range" id="scrub" min="0" max="0" value="0" step="any"></div>
      <div class="trackwrap"><div class="tlabels" id="tlabels"></div><div id="track"></div></div>
      <details class="box" id="boardbox"><summary>📊 詳細名次表（漲幅、預測差、起跑價／終點價）</summary><table id="board"><thead><tr><th>名次</th><th>馬匹</th><th>漲幅</th><th>預測</th><th>起跑價</th><th id="endcol">終點價</th></tr></thead><tbody></tbody></table></details>
    </section>

    <section id="tab-card" hidden>
      <div id="cinfo"></div>
      <div class="controls"><button id="galBtn">🎨 馬匹圖鑑</button></div>
      <div id="gallery" hidden>
        <p class="muted">滑鼠移上去／手機點一下，馬會奔跑。毛色與花紋只參考公司 logo 的配色與大致樣式，不是 logo 本身。</p>
        <h2>公司專屬馬</h2><div class="grid" id="brands"></div>
        <h2>通用毛色</h2><div class="grid" id="generic"></div>
      </div>
      <div id="cards"></div>
      <details class="box"><summary>🔮 預測怎麼算</summary><div id="method"></div></details>
      <details class="box"><summary>🔎 資料來源與真實性</summary><div id="truth"></div></details>
    </section>

    <section id="tab-bet" hidden><div id="betview"></div></section>
  </div>
  <footer id="foot"></footer>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const COLORS = ["#e5484d","#4f8df7","#76b900","#f5a623","#a855f7","#14b8a6","#ec4899","#6b7280","#0ea5e9","#84cc16"];
const POOL_NAME = { spx: "S&P 500", ndx: "Nasdaq-100", all: "合併" };
const CYC_NAME = { d: "1天", w: "1週", w2: "2週", m: "1個月", q: "季", h: "半年" };
const DURATION = { slow: 45, mid: 25, fast: 12 };               // seconds for a whole replay
const CATCHUP = { slow: 16, mid: 8, fast: 4 };                  // seconds to run the season-to-date on the first screen
const HELP = {
  field: "參賽＝上一期漲幅最高的 10 檔（開跑前就已知的名單，已還原股利與分割）。",
  camera: "鏡頭跟著領先馬：它固定在右側，其他馬依「落後領先者多少個百分點」排在左邊（開根號壓縮，小差距也看得出）。地面向後捲動＝大家都在向前跑，落後的馬只是比領先者慢。終點線＝這一期最後一個交易日收盤，只在最後階段才進場，之後各馬依實際名次衝線。",
  live: "這一期還在進行：畫面是截至最新收盤的排名，馬群持續奔跑。沒有終點線（要等期末才知道誰贏）。按「↺ 重播」可從開賽日再跑一次。",
  odds: "賠率隨賽況即時調整：開賽時依馬報評估分（能力 70% ＋ 近績 30%）定價，越往後越偏向「目前排名＋剩餘天數」的模擬勝率；抽水從 15% 升到 40%，所以越晚下注賠率越低。下注當下的賠率會鎖定。點數是虛擬的，沒有金錢價值。",
  place: "位置＝你押的馬只要跑進前 3 名就算中，賠率較低但比較容易中。獨贏＝必須第 1 名才中。",
  form: "近績＝這匹馬在前 4 期（新→舊）真正出賽的名次，名次是在當期參賽的 10 匹馬中的排名；沒出場的期別標「未」。每期的參賽馬都是上一期的前 10 名，所以多數馬是首次出賽。金／銀／銅＝第 1／2／3 名。",
  style: "看牠最近（最多 3 次）真正出賽時「前 1/3 段」的平均排名：≤2.5 領放、≤4.5 跟前、≤7 居中、>7 後上。沒出過場就標「未知」。",
  ability: "五項能力是這匹馬在整個馬群中的百分位（0–100，越高越好）。點能力名稱可看實際參數。",
  total: "能力指數＝五項能力依歷史相關性加權平均；馬號依能力指數排序，1 號＝◎本命，◎○▲△△ 為前 5 名。",
};
let D, pool = "all", cyc = "q", tab = "race", perK = 0;
let race, T = 0, phase = "idle", raf = 0, lastTs = 0, shownDay = -1, st = [], G = {};
let bank = { balance: 1000, bets: [] }, slip = { ticker: null, type: "win", stake: 50 };
try { pool = localStorage.getItem("derby.pool") || pool; cyc = localStorage.getItem("derby.cyc") || cyc; } catch (e) {}
try { const b = JSON.parse(localStorage.getItem("derby.bank.v1")); if (b && Array.isArray(b.bets)) bank = b; } catch (e) {}

const pct = (v, d = 2) => (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const cls = v => v >= 0 ? "up" : "down";
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const squash = v => Math.sign(v) * Math.sqrt(Math.abs(v));

/* ---- pack-camera track: the leader is fixed at the right, every other horse sits behind it by its gap ---- */
const GMIN = 0.06, VS = 0.62;                             // smallest zoom reference (6 pp); finishing sprint speed
function layout() {
  const W = $("track").clientWidth || 320, narrow = W < 560, gut = narrow ? 76 : 150;
  const top = $("track").getBoundingClientRect().top + scrollY;             // lanes must fit between here and the bottom of the screen
  const laneH = clamp(Math.floor((innerHeight - top - 28) / 10), narrow ? 24 : 34, 56);
  const scale = (laneH - 4) / 36, spW = 48 * scale, spH = 36 * scale, Wf = W - gut;
  const rowH = laneH + 2;
  const xmin = spW * 0.95 + 2, xl = Math.max(xmin + 40, Wf * 0.74);          // leader's nose x
  const cap = (Wf - 3 - xmin) / (xl - xmin);                                 // furthest nose position after the line, in frac units
  G = { ...G, W, narrow, gut, laneH, rowH, scale, spW, spH, Wf, xmin, xl, nose: 46 * scale, cap, rankStep: (0.8 * (Wf - 3 - xl) / 9) / (xl - xmin) };
  const tr = $("track").style; tr.setProperty("--lane-h", laneH + "px"); tr.setProperty("--gut", gut + "px"); tr.height = (10 * rowH) + "px";
}
// Gaussian-smooth the daily series (edges replicated, both ends pinned) so one-day jumps become gentle surges
function smooth(path, sigma) {
  if (path.length < 3) return path.slice();
  const r = Math.ceil(3 * sigma), ker = []; let sum = 0;
  for (let j = -r; j <= r; j++) { const w = Math.exp(-(j * j) / (2 * sigma * sigma)); ker.push(w); sum += w; }
  const sm = path.map((_, i) => ker.reduce((a, w, j) => a + w * path[clamp(i + j - r, 0, path.length - 1)], 0) / sum);
  const n = path.length - 1, e0 = path[0] - sm[0], e1 = path[n] - sm[n];
  return sm.map((v, i) => v + e0 * (1 - i / n) + e1 * (i / n));
}
function sample(path, t) {                                       // cubic Catmull-Rom between days
  const n = path.length - 1; if (n < 1) return path[0];
  const i = clamp(Math.floor(t), 0, n - 1), f = clamp(t - i, 0, 1);
  const p0 = path[Math.max(0, i - 1)], p1 = path[i], p2 = path[i + 1], p3 = path[Math.min(n, i + 2)];
  return 0.5 * ((2 * p1) + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
}
function standing(t) {                                           // gap to the current leader -> frac (1 = leader)
  const r = race.horses.map(h => sample(h.sp, t)), lead = Math.max(...r), gaps = r.map(v => lead - v);
  return { gaps, gmax: Math.max(GMIN, ...gaps) };
}
const fracOf = (gap, gref) => 1 - Math.sqrt(clamp(gap / gref, 0, 1));
const rankOf = h => [...race.horses].sort((a, b) => b.ret - a.ret).indexOf(h);

function setupTrack() {
  layout();
  const hs = race.horses, sigma = Math.max(1.5, race.days / 25);
  hs.forEach(h => { h.sp = smooth(h.path, sigma); });
  $("track").innerHTML = hs.map(h =>
    `<div class="lane nt" data-n="${h.no}"><div class="gut"><div class="gl1"><b class="rk"></b><i class="sd" style="background:${COLORS[h.no - 1]}">${h.no}</i><span>${G.narrow ? esc(h.ticker) : esc(h.horse_zh) + " " + esc(h.ticker)}</span></div>${G.laneH >= 34 ? '<div class="gl2"></div>' : ""}</div>` +
    `<div class="field"><div class="horse"><div class="sprite" style="background-image:url(assets/horses/${h.sprite}.png);width:${G.spW}px;height:${G.spH}px;background-size:${7 * G.spW}px ${G.spH}px"></div>${G.narrow ? "" : `<span class="tag" style="background:${COLORS[h.no - 1]}"></span>`}</div></div></div>`).join("");
  const over = document.createElement("div");
  over.style.cssText = `position:absolute;top:0;bottom:0;left:${G.gut}px;right:0;pointer-events:none`;
  over.innerHTML = '<div class="vline finish" id="fline" hidden></div>';
  $("track").style.position = "relative"; $("track").append(over);
  $("tlabels").innerHTML = `<span style="left:${G.gut + 6}px">領先馬在右，其餘依落後幅度排左</span>`;
  $("scrub").max = Math.max(race.days, 0.001);
  G.ground = 0; G.firstPaint = true;
}

function resetPhysics(t) {
  T = t; phase = "idle"; shownDay = -1;
  const sd = standing(t); G.gref = sd.gmax;
  st = race.horses.map((h, i) => ({ pos: fracOf(sd.gaps[i], G.gref), vel: 0, phase: i * 0.37, frame: 6 }));
}
// finished race opened from the history: the horses wait at the start line; "開跑" runs it, "直接看結果" jumps to the last day
function showStart() { $("play").hidden = true; $("result").hidden = false; $("replay").textContent = "▶ 開跑"; resetPhysics(0); G.ground = 0; paint(false); }
function showFinal() { stop(); $("play").hidden = true; resetPhysics(race.days); paint(false); $("replay").textContent = "▶ 再看一次"; }
// race in progress: run the season-to-date quickly, then keep galloping at the latest standing
function startLive() { $("play").hidden = false; $("result").hidden = true; $("replay").textContent = "↺ 重播"; resetPhysics(0); paint(false); if (race.days < 1) { T = 0; phase = "cruise"; go(); } else { phase = "run"; go(); } }
function go() { cancelAnimationFrame(raf); lastTs = performance.now(); $("play").textContent = "⏸ 暫停"; raf = requestAnimationFrame(tick); }

// Spring-damper: each horse *follows* its target with inertia -> smooth acceleration and braking.
// Stride rate follows speed (leaders and surging horses stride faster); nobody ever runs backwards.
function stepPhysics(dt) {
  const dur = race.finish === false ? CATCHUP[$("speed").value] : DURATION[$("speed").value], sprint = phase === "sprint";
  const k = sprint ? 30 : 9, c = 2 * Math.sqrt(k) * 1.1;
  let sd = null;
  if (!sprint) { sd = standing(T); G.gref += (sd.gmax - G.gref) * Math.min(1, dt * 2.5); }
  race.horses.forEach((h, i) => {
    const s = st[i];
    const target = sprint ? Math.min(G.endFrac[i] + VS * G.sprintT, G.cap - G.rankStep * rankOf(h)) : fracOf(sd.gaps[i], G.gref);
    for (let j = 0; j < 3; j++) { const d = dt / 3; s.vel += (k * (target - s.pos) - c * s.vel) * d; s.pos += s.vel * d; }
    const stride = sprint ? clamp(2.6 + 2.6 * Math.min(1, Math.abs(s.vel) / 0.5), 2, 5.4) : clamp(2.8 + 5 * s.vel * dur + 1.0 * clamp(s.pos, 0, 1), 2, 5.2);
    s.phase += stride * dt; s.frame = Math.floor(s.phase * 6) % 6;
  });
}

function paint(running) {
  // the track doubles as the standings: lanes are ordered by current rank, the leader's lane is on top
  const cur = race.horses.map((h, i) => ({ h, i, r: sample(h.path, T) })).sort((a, b) => b.r - a.r);
  const finished = race.finish !== false && T >= race.days && race.days > 0;
  cur.forEach(({ h, r }, rank) => {
    const lane = $("track").querySelector(`.lane[data-n="${h.no}"]`);
    lane.style.transform = `translateY(${rank * G.rowH}px)`; lane.classList.toggle("alt", rank % 2 === 1);
    lane.querySelector(".rk").textContent = finished && rank === 0 ? "🏆" : rank + 1;
    const pc = lane.querySelector(".gl2"); if (pc) { pc.textContent = pct(r); pc.className = "gl2 " + cls(r); }
  });
  if (G.firstPaint) { G.firstPaint = false; requestAnimationFrame(() => $("track").querySelectorAll(".lane.nt").forEach(l => l.classList.remove("nt"))); }
  race.horses.forEach((h, i) => {
    const s = st[i], el = $("track").querySelector(`.lane[data-n="${h.no}"] .horse`), x = G.xmin + s.pos * (G.xl - G.xmin) - G.nose;
    el.style.transform = `translateX(${x}px)`;
    el.firstElementChild.style.backgroundPositionX = (running ? -s.frame * G.spW : -6 * G.spW) + "px";
    const tag = el.querySelector(".tag"); if (tag) tag.textContent = pct(sample(h.path, T));
  });
  $("track").style.setProperty("--gx", -G.ground + "px");
  const fl = $("fline");                                       // the finish line only exists once the period's last day is in sight
  if (fl) { const u = race.finish === false || race.days < 1 ? 0 : T / race.days; fl.hidden = !(race.finish !== false && u > 0.9);
    if (!fl.hidden) fl.style.left = (G.xl + (phase === "sprint" || phase === "done" || u >= 1 ? 0 : (1 - (u - 0.9) / 0.1) * (G.Wf - 4 - G.xl)) - 4) + "px"; }
  const day = Math.min(race.days, Math.round(T));
  if (day !== shownDay) { shownDay = day; paintBoard(day); }
  $("date").textContent = md(race.dates[Math.min(day, race.dates.length - 1)]);
  $("scrub").value = T;
}

function paintBoard(day) {
  const finished = race.finish !== false && day >= race.days, showEnd = finished || race.finish === false;
  const rows = race.horses.map(h => ({ h, r: h.path[Math.min(day, h.path.length - 1)] })).sort((a, b) => b.r - a.r);
  $("board").querySelector("tbody").innerHTML = rows.map(({ h, r }, i) => {
    const diff = h.pred - (i + 1);
    return `<tr><td>${finished && i === 0 ? "🏆" : i + 1}</td><td>${h.no} ${esc(h.horse_zh)} <small class="muted">${esc(h.ticker)}</small></td>` +
      `<td class="${cls(r)}">${pct(r)}</td><td>${h.pred}${h.mark} ${showEnd && race.days > 0 ? `<small class="${diff >= 0 ? "up" : "down"}">${diff > 0 ? "▲" + diff : diff < 0 ? "▼" + -diff : "＝"}</small>` : ""}</td>` +
      `<td class="hide-narrow">$${h.price_start.toFixed(2)}</td><td class="hide-narrow">${showEnd ? "$" + h.price_end.toFixed(2) : "—"}</td></tr>`;
  }).join("");
}

function tick(ts) {
  if (phase === "idle" || phase === "done") return;
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (phase === "run") {
    const dur = race.finish === false ? CATCHUP[$("speed").value] : DURATION[$("speed").value], u = T / race.days, ease = 0.55 + 0.9 * Math.sin(Math.PI * clamp(u, 0, 1));
    T = Math.min(race.days, T + dt * (race.days / dur) * ease); G.ground += dt * 150;
    if (T >= race.days) {
      if (race.finish === false) { phase = "cruise"; }
      else { const sd = standing(race.days); G.endFrac = sd.gaps.map(g => fracOf(g, G.gref)); G.sprintT = 0; G.sprintDur = (1 - Math.min(...G.endFrac)) / VS + 1.4; phase = "sprint"; }
    }
  } else if (phase === "sprint") {                          // everyone runs on and crosses the line in finishing order
    G.sprintT += dt; G.ground += dt * 230;
    if (G.sprintT > G.sprintDur) { phase = "done"; paint(false); $("replay").textContent = "▶ 再看一次"; return; }
  } else if (phase === "cruise") {                          // the period is still running: keep galloping at the latest standing
    G.ground += dt * 120;
  }
  stepPhysics(dt); paint(true);
  raf = requestAnimationFrame(tick);
}
function stop() { cancelAnimationFrame(raf); if (phase === "run" || phase === "sprint" || phase === "cruise") phase = "idle"; const p = $("play"); if (p) p.textContent = "▶ 繼續"; if (race && tab === "race") paint(false); }
function replay() { if (!race) return; stop(); resetPhysics(0); G.ground = 0; paint(false); $("play").hidden = race.finish !== false && false; phase = race.days < 1 ? "cruise" : "run"; go(); }
function resume() { if (!race) return; if (T >= race.days && race.finish !== false) { replay(); return; } phase = T >= race.days ? "cruise" : "run"; go(); }

let galleryLoaded = false;

  if (galleryLoaded) return; galleryLoaded = true;
  fetch("assets/horses/manifest.json").then(r => r.json()).then(m => {
    const c = (file, title, sub, extra) => `<div class="gc" onclick="this.classList.toggle('on')"><div class="stage"><div class="sprite" style="background-image:url(assets/horses/${file}.png)"></div></div><b>${esc(title)}</b><div class="muted">${esc(sub)}</div><div class="muted">${extra}</div></div>`;
    $("brands").innerHTML = Object.entries(m.brands).map(([t, b]) => c(t, b.zh, `${b.en}・${t}`, `<span class="swatch" style="background:${b.silks.primary}"></span><span class="swatch" style="background:${b.silks.secondary}"></span>${esc(b.inspired_by)}`)).join("");
    $("generic").innerHTML = Object.entries(m.generic).map(([k, g]) => c("generic_" + k, g.zh, k, esc(g.features))).join("");
  });
}

/* ================= bet tab: odds board, bet slip, tickets (virtual points) ================= */
function settleBets() {
  let changed = false;
  for (const b of bank.bets) {
    if (b.status !== "pending") continue;
    const s = D.settled[b.raceId]; if (!s) continue;
    const rank = s.result[b.ticker], win = b.type === "win" ? rank === 1 : rank != null && rank <= 3;
    b.status = win ? "won" : "lost"; b.rank = rank ?? null; b.settledOn = s.end;
    b.payout = win ? Math.round(b.stake * b.odds) : 0; bank.balance += b.payout; changed = true;
  }
  if (changed) saveBank();
}
const liveOf = () => races().find(r => r.status === "upcoming");
const isOpen = r => r && r.live.betting_open && Date.now() < Date.parse(r.live.close_at);
const typeName = t => t === "win" ? "獨贏" : "位置（前三名）";
function barcode(seed) {                                   // decorative barcode derived from the ticket number
  let x = 7; for (const ch of seed) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  let bars = "", pos = 0;
  for (let i = 0; i < 46; i++) { x = (x * 1103515245 + 12345) >>> 0; const w = 1 + (x >> 16) % 3; if (i % 2 === 0) bars += `<rect x="${pos}" y="0" width="${w}" height="30" fill="#222"/>`; pos += w; }
  return `<svg viewBox="0 0 ${pos} 30" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
}
const ticketNo = b => { let x = 0; for (const ch of (b.id || b.raceId + b.ticker + b.stake)) x = (x * 33 + ch.charCodeAt(0)) >>> 0; return x.toString(16).toUpperCase().padStart(8, "0").replace(/(.{4})(.{4})/, "$1-$2"); };
function ticketHtml(b) {
  const stamp = b.status === "pending" ? ["pending", "待開獎"] : b.status === "won" ? ["won", "中獎"] : ["lost", "未中"];
  const payout = b.status === "won" ? b.payout : Math.round(b.stake * b.odds);
  return `<div class="ticket ${b.status === "pending" ? "" : b.status}">
    <div class="th">虛擬賽馬會<small>SIMULATED RACING CLUB ・ 虛擬點數 ・ 僅供娛樂</small></div>
    <div class="r"><span>票號</span><b>${ticketNo(b)}</b></div>
    <div class="r"><span>賽事</span><b>${esc(b.title || b.raceId)}</b></div>
    <div class="r"><span>投注時間</span><span>${esc((b.placedAt || b.placedOn || "").replace("T", " ").slice(0, 16))}</span></div>
    <div class="pick">${esc(typeName(b.type))}<br>#${b.no ?? "?"} ${esc(b.horse)}<small>${esc(b.ticker)}</small></div>
    <div class="r"><span>投注額</span><b>${b.stake}</b></div>
    <div class="r"><span>賠率</span><b>${b.odds.toFixed(1)} 倍</b></div>
    <div class="r"><span>${b.status === "won" ? "派彩" : b.status === "lost" ? "派彩" : "預計派彩"}</span><b>${b.status === "lost" ? 0 : payout}</b></div>
    ${b.status === "lost" ? `<div class="r"><span>實際名次</span><span>第 ${b.rank ?? "—"} 名</span></div>` : ""}
    ${barcode(ticketNo(b))}<div class="stamp ${stamp[0]}">${stamp[1]}</div></div>`;
}
// next scheduled data refresh (UTC): 23:30 Mon-Fri, 05:30 and 12:30 Tue-Sat
function nextRefresh(now = new Date()) {
  const plan = [[23, 30, [1, 2, 3, 4, 5]], [5, 30, [2, 3, 4, 5, 6]], [12, 30, [2, 3, 4, 5, 6]]];
  let best = null;
  for (let d = 0; d < 8; d++) for (const [h, m, days] of plan) {
    const t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + d, h, m));
    if (t > now && days.includes(t.getUTCDay()) && (!best || t < best)) best = t;
  }
  return best;
}
function closedReason(r) {
  const L = r.live, nx = nextRefresh();
  const why = !L.betting_open ? `這一期已過 ${(L.close_u * 100).toFixed(0)}% 的交易日，不再收單` : `已過截止時間（${fmtClose(L.close_at)}，美股開盤）`;
  return `${why}。結果預計 ${md(r.planned_end)} 收盤後揭曉；下一期要等這一期的結果出爐才會開始（約 ${md(L.next_first_session)} 起），屆時資料更新後（下次約 ${fmtClose(nx.toISOString())}）就能下注。`;
}
function note(msg) { const el = $("betnote"); if (!el) return; el.textContent = msg; el.hidden = false; el.scrollIntoView({ block: "center", behavior: "smooth" }); }

function renderBet() {
  const r = liveOf();
  if (!r) { $("betview").innerHTML = `<div class="box">這個馬群／週期目前沒有進行中的賽事。</div>`; return; }
  const L = r.live, open = isOpen(r), mine = bank.bets.filter(b => b.raceId === r.id);
  if (!slip.ticker || !r.horses.find(h => h.ticker === slip.ticker)) slip.ticker = null;
  const oddsOf = (h, t) => t === "win" ? h.odds_win : h.odds_place;
  const led = (h, type) => { const now = oddsOf(h, type), o = type === "win" ? h.odds_win_open : h.odds_place_open;
    return `<button class="led ${open ? "" : "shut"} ${slip.ticker === h.ticker && slip.type === type ? "sel" : ""}" data-pick="${h.ticker}" data-type="${type}">${now.toFixed(1)}${Math.abs(now - o) >= 0.05 ? `<small>開 ${o.toFixed(1)}</small>` : ""}</button>`; };
  const slipRow = h => {
    const odds = oddsOf(h, slip.type), enough = slip.stake <= bank.balance;
    return `<tr><td colspan="4" class="slipcell"><div class="slip">
      <h3>投注單 <small>BET SLIP・${esc(CYC_NAME[cyc])}賽 ${esc(r.label || md(r.start))}</small></h3>
      <div class="step">${slip.type === "win" ? "獨贏：押它拿第 1 名" : "位置：押它進前 3 名（只要前三名就中，賠率較低）"}　<a href="#" data-flip="${slip.type === "win" ? "place" : "win"}" style="color:#b0314a">改押${slip.type === "win" ? "位置" : "獨贏"}</a></div>
      <div class="sum" style="border:0;margin:0;padding:0"><span>#${h.no} ${esc(h.horse_zh)} @ ${odds.toFixed(1)}</span><span>預計派彩 <b>${Math.round(slip.stake * odds)}</b></span></div>
      <div class="step">金額（點）</div>
      <div class="stakes">${[10, 50, 100, 200, 500].map(v => `<button data-stake="${v}" class="${slip.stake === v ? "on" : ""}">${v}</button>`).join("")}</div>
      <div class="sum"><span class="muted">${slip.type === "place" ? `例：押 100 點、賠率 ${odds.toFixed(1)}，進前三名 → 拿回 ${Math.round(100 * odds)} 點` : `例：押 100 點、賠率 ${odds.toFixed(1)}，拿第 1 名 → 拿回 ${Math.round(100 * odds)} 點`}${enough ? "" : "　<b style=\"color:#b0314a\">點數不足</b>"}</span>
        <span><button id="cancelSlip" style="background:#fff;color:#2a2320">取消</button> <button class="go" id="confirmBet">確認投注</button></span></div></div></td></tr>`;
  };
  const rows = r.horses.map(h => `<tr><td><span class="saddle" style="background:${COLORS[h.no - 1]}">${h.no}</span></td><td>${esc(h.horse_zh)} <small class="muted" style="color:#8fb59a">${esc(h.ticker)}</small><br><span class="form-dots">${h.form.map(x => x ?? "未").join(" ")}</span></td><td>${led(h, "win")}</td><td>${led(h, "place")}</td></tr>`
    + (slip.ticker === h.ticker ? slipRow(h) : "")).join("");
  $("betview").innerHTML = `
    <div id="betnote" class="betnote" role="alert" hidden></div>
    <div class="box">💰 虛擬點數 <b>${bank.balance}</b>　<span class="muted">待開獎 ${bank.bets.filter(b => b.status === "pending").length} 張</span>　<button id="resetBank" class="i" style="font-size:11px">重設</button>${tip(HELP.odds)}</div>
    <div class="oddsboard">
      <div class="ob-title"><span>賠率投注板</span><small>${esc(cycTitle(r))}</small><span class="ob-status ${open ? "open" : "shut"}">${open ? "開放投注" : "已截止"}</span></div>
      <div class="ob-title"><small>${open ? `截止 ${fmtClose(L.close_at)}（美股開盤前）・目前抽水 ${(L.tau * 100).toFixed(0)}%・越晚下注賠率越低・點賠率即可下注` : closedReason(r)}</small></div>
      <table><thead><tr><th>號</th><th>馬匹／近績</th><th>獨贏<br><small>第 1 名</small></th><th>位置<br><small>前 3 名</small>${tip(HELP.place)}</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <h2>我的注單</h2>
    ${mine.length ? `<div class="tickets">${mine.slice().reverse().map(ticketHtml).join("")}</div>` : `<div class="muted">這一期還沒有注單。結果在期末收盤後揭曉，下次開啟頁面時自動結算。</div>`}
    ${bank.bets.filter(b => b.raceId !== r.id).length ? `<h2>其他賽事的注單</h2><div class="tickets">${bank.bets.filter(b => b.raceId !== r.id).slice().reverse().slice(0, 12).map(ticketHtml).join("")}</div>` : ""}`;
}
$("betview").addEventListener("click", e => {
  const r = liveOf(); if (!r) return;
  if (e.target.id === "resetBank") { if (confirm("重設虛擬點數為 1000 並清除所有注單？")) { bank = { balance: 1000, bets: [] }; saveBank(); slip.ticker = null; renderBet(); } return; }
  const flip = e.target.closest("[data-flip]"); if (flip) { e.preventDefault(); slip.type = flip.dataset.flip; renderBet(); return; }
  if (e.target.id === "cancelSlip") { slip.ticker = null; renderBet(); return; }
  if (e.target.id === "confirmBet") {
    const h = r.horses.find(x => x.ticker === slip.ticker);
    if (!h) return;
    if (!isOpen(r)) { note("無法投注：" + closedReason(r)); return; }
    if (slip.stake > bank.balance) { note(`點數不足：目前只有 ${bank.balance} 點，請選較小的金額。`); return; }
    const odds = slip.type === "win" ? h.odds_win : h.odds_place, now = new Date();
    bank.balance -= slip.stake;
    bank.bets.push({ id: now.getTime().toString(36) + Math.random().toString(36).slice(2, 6), raceId: r.id, title: cycTitle(r), ticker: h.ticker, horse: h.horse_zh, no: h.no, type: slip.type, stake: slip.stake, odds, u: r.live.u, status: "pending", placedAt: now.toISOString() });
    saveBank(); slip.ticker = null; renderBet(); const t = document.querySelector(".tickets"); if (t) t.scrollIntoView({ block: "start", behavior: "smooth" }); return;
  }
  const st_ = e.target.closest("[data-stake]"); if (st_) { slip.stake = +st_.dataset.stake; renderBet(); return; }
  const pk = e.target.closest("[data-pick]");
  if (pk) {
    if (!isOpen(r)) { note("目前不能下注：" + closedReason(r)); return; }
    slip.ticker = pk.dataset.pick; slip.type = pk.dataset.type; renderBet();
    const row = document.querySelector(".slip"); if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
  }
});

/* ================= wiring ================= */
document.addEventListener("click", e => {
  const i = e.target.closest("button.i"); if (i && i.nextElementSibling && i.nextElementSibling.classList.contains("tt")) { i.nextElementSibling.hidden = !i.nextElementSibling.hidden; return; }
  const a = e.target.closest(".arow"); if (a) { const d = a.nextElementSibling; if (d && d.classList.contains("tt")) d.hidden = !d.hidden; }
});
$("tabs").onclick = e => { if (e.target.dataset.t) showTab(e.target.dataset.t); };
$("pool").onclick = e => { if (e.target.dataset.v) { pool = e.target.dataset.v; perK = 0; slip.ticker = null; render(); } };
$("cyc").onclick = e => { if (e.target.dataset.v) { cyc = e.target.dataset.v; perK = 0; slip.ticker = null; render(); } };
$("perSel").onchange = e => { perK = +e.target.value; render(); };
$("galBtn").onclick = () => { $("gallery").hidden = !$("gallery").hidden; if (!$("gallery").hidden) loadGallery(); $("galBtn").textContent = $("gallery").hidden ? "🎨 馬匹圖鑑" : "🎨 收起圖鑑"; };
$("play").onclick = () => (phase === "run" || phase === "sprint" || phase === "cruise") ? stop() : resume();
$("replay").onclick = replay;
$("result").onclick = showFinal;
$("scrub").oninput = e => { stop(); resetPhysics(+e.target.value); paint(false); };
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === "race" && race) { const t = T, ph = phase; stop(); setupTrack(); resetPhysics(t); paint(false); if (ph === "cruise" || ph === "run") { phase = ph; go(); } } }, 150); });
document.addEventListener("visibilitychange", () => { if (document.hidden && (phase === "cruise" || phase === "run")) { const p = phase; stop(); phase = "idle"; $("play").dataset.was = p; } else if (!document.hidden && $("play").dataset.was && tab === "race") { phase = $("play").dataset.was; delete $("play").dataset.was; go(); } });

fetch("data/derby.json").then(r => r.json()).then(d => {
  D = d; if (!D.pools[pool]) pool = "all"; if (!D.pools[pool][cyc]) cyc = "q";
  settleBets();
  $("msg").hidden = true; $("app").hidden = false;
  $("foot").textContent = `資料更新至 ${D.asof}（每天固定更新三次）。僅供娛樂，非投資建議；下注使用虛擬點數。`;
  const h = (location.hash || "").slice(1); showTab(["race", "card", "bet"].includes(h) ? h : "race");
}).catch(e => { $("msg").textContent = "資料載入失敗：" + e.message; });
</script>
