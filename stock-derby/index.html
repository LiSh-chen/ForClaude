<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Derby 美股賽馬</title>
<style>
  :root { --bg:#f6f4ee; --fg:#1d2b1f; --track:#c9a66b; --track2:#bd9a5e; --grass:#4c8a4a; --card:#fffdf7; --muted:#6b7367; --up:#1a8f4c; --down:#d23b3b; --line:rgba(128,128,128,.25); --gold:#d4a017; --accent:#2f6b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181a; --fg:#e8ece6; --track:#7d6638; --track2:#725d33; --grass:#2f5a2e; --card:#1d2326; --muted:#98a39a; --accent:#6fbf7a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 4px; font-size:1.5rem; } h2 { font-size:1.15rem; margin:24px 0 8px; }
  .sub { color:var(--muted); margin:0 0 12px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:8px 0; }
  .seg { display:inline-flex; border:1px solid var(--muted); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:var(--accent); color:#fff; }
  button, select { font:inherit; padding:6px 12px; border:1px solid var(--muted); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--grass); color:#fff; border-color:var(--grass); }
  input[type=range] { flex:1; min-width:140px; }
  .date { font-variant-numeric:tabular-nums; font-weight:600; min-width:7em; }
  /* race card */
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .cardsp { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .no { width:36px; height:24px; border-radius:8px; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .head { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; }
  .tk { font-size:1.15rem; font-weight:700; } .muted { color:var(--muted); font-size:13px; }
  .mark { font-size:1.3rem; color:var(--gold); font-weight:700; }
  .body { grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:8px 20px; }
  .lbl { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .chips { display:flex; gap:4px; }
  .chip { min-width:28px; text-align:center; padding:1px 6px; border-radius:6px; background:var(--line); font-weight:600; font-variant-numeric:tabular-nums; }
  .chip.g1 { background:var(--gold); color:#fff; } .chip.g2 { background:#9aa3ab; color:#fff; } .chip.g3 { background:#b87333; color:#fff; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--accent); color:#fff; font-size:13px; font-weight:600; }
  .abil { display:grid; grid-template-columns:minmax(120px,auto) 1fr 32px; gap:2px 8px; align-items:center; font-size:13px; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
  .stars { color:var(--gold); letter-spacing:1px; }
  .cmt { grid-column:1 / -1; font-size:14px; }
  /* track */
  .track { background:var(--grass); border-radius:12px; padding:8px 0; position:relative; overflow:hidden; }
  .lane { position:relative; height:62px; margin:2px 0; background:var(--track); border-top:2px dashed rgba(255,255,255,.35); }
  .lane:nth-child(even) { background:var(--track2); }
  .name { position:absolute; left:8px; top:2px; font-size:12px; font-weight:600; color:#fff; text-shadow:0 1px 2px #0008; z-index:2; pointer-events:none; }
  .horse { position:absolute; top:4px; left:0; will-change:transform; z-index:1; white-space:nowrap; display:flex; align-items:flex-end; }
  .horse .tag { font-size:11px; font-weight:700; color:#fff; padding:1px 6px; border-radius:10px; margin-left:4px; margin-bottom:6px; }
  /* 48x36 px pixel sprites, 7 frames per sheet (6 gallop + 1 standing), shown at 1.5x */
  .sprite { width:72px; height:54px; background-size:504px 54px; background-position:-432px 0; image-rendering:pixelated; flex:none; }
  .sprite.live { animation:gallop var(--spd,.55s) steps(6) infinite; }
  @keyframes gallop { from { background-position:0 0; } to { background-position:-432px 0; } }
  details.box { margin:10px 0; } details summary { cursor:pointer; font-weight:600; color:var(--fg); }
  .box ol, .box ul { margin:6px 0 6px 18px; padding:0; } .box table { margin-top:8px; font-size:13px; }
  .warn { color:#b45309; } @media (prefers-color-scheme: dark) { .warn { color:#fbbf24; } }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:3px; border:1px solid var(--line); }
  .finish { position:absolute; right:12px; top:0; bottom:0; width:10px; z-index:1; background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/10px 10px; opacity:.85; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; margin-top:12px; }
  th, td { padding:6px 10px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align:left; }
  .up { color:var(--up); } .down { color:var(--down); }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:13px; color:var(--muted); }
  .box b { color:var(--fg); }
  #msg { padding:24px; text-align:center; color:var(--muted); }
  footer { color:var(--muted); font-size:12px; margin:20px 0; }
</style>
</head>
<body>
<main>
  <h1>🏇 Stock Derby 美股賽馬</h1>
  <p class="sub">股票當賽馬：看賽馬報選馬，再看誰先衝線。<a href="gallery.html">🎨 馬匹圖鑑</a></p>

  <div class="controls">
    <span>參賽馬群
      <span class="seg" id="pool"><button data-v="spx">S&amp;P 500</button><button data-v="ndx">Nasdaq-100</button><button data-v="all">兩者合併</button></span></span>
    <span>賽程
      <span class="seg" id="dist"><button data-v="1m">1 個月</button><button data-v="3m">3 個月</button><button data-v="6m">6 個月</button></span></span>
  </div>
  <div id="msg">載入資料中…</div>
  <div id="app" hidden>
    <div class="box" id="info"></div>
    <details class="box" id="truth"></details>

    <h2>📋 賽馬報</h2>
    <details class="box" id="method" open></details>
    <div id="cards"></div>

    <h2>🏁 賽事</h2>
    <div class="controls">
      <button id="play" class="primary">▶ 開跑</button>
      <button id="reset">⏮ 重來</button>
      <label>速度 <select id="speed"><option value="slow">慢</option><option value="mid" selected>中</option><option value="fast">快</option></select></label>
      <span class="date" id="date"></span>
      <input type="range" id="scrub" min="0" max="0" value="0">
    </div>
    <div class="track" id="track"></div>
    <table id="board"><thead><tr><th>名次</th><th>馬匹</th><th>起跑價</th><th>現價/終點價</th><th>漲幅</th><th>賽前預測</th><th>預測差</th></tr></thead><tbody></tbody></table>
  </div>
  <footer id="foot"></footer>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const COLORS = ["#e5484d","#4f8df7","#76b900","#f5a623","#a855f7","#14b8a6","#ec4899","#6b7280","#0ea5e9","#84cc16"];
const POOL_NAME = { spx: "S&P 500", ndx: "Nasdaq-100", all: "S&P 500 + Nasdaq-100" };
const DIST_NAME = { "1m": "1個月", "3m": "3個月", "6m": "6個月" };
const DURATION = { slow: 45, mid: 25, fast: 12 };           // seconds for the whole race
let D, pool = "all", dist = "3m", race, T = 0, playing = false, lastTs = 0, raf = 0, shownDay = -1, lo = 0, span = 1;
let st = [];                                                // per-horse physics: {pos, vel, phase, frame}
try { pool = localStorage.getItem("derby.pool") || pool; dist = localStorage.getItem("derby.dist") || dist; } catch (e) {}

const pct = (v, d = 2) => (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const cls = v => v >= 0 ? "up" : "down";
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const squash = v => Math.sign(v) * Math.sqrt(Math.abs(v));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const swatch = h => h.silks ? `<span class="swatch" style="background:${h.silks.primary}"></span><span class="swatch" style="background:${h.silks.secondary}"></span>` : "";
const fmtRaw = (f, v) => v == null ? "—" : f.fmt === "pct" ? pct(v, 1) : v.toFixed(2);

function segs() {
  for (const [id, cur] of [["pool", pool], ["dist", dist]])
    $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === cur));
}

/* ---------------- race card ---------------- */
function renderInfo() {
  const cv = race.coverage, ns = D.ndx_status, v = race.validation;
  $("info").innerHTML = `<b>${POOL_NAME[pool]}・${DIST_NAME[dist]}賽</b>｜起跑 ${race.start} → 終點 ${race.end}（${race.days} 個交易日）<br>` +
    `參賽陣容：<b>${POOL_NAME[pool]}成分股在這段期間漲幅最高的 10 檔</b>（起跑日收盤價 → 終點日收盤價，已還原股利與分割）。` +
    `馬號依賽前預測排序（1 號＝◎本命）。賽馬報的近績、跑法、能力只用<b>起跑日以前</b>的資料。`;
  const ndxWarn = ns.source === "fallback" ? `<li class="warn">⚠️ Nasdaq-100 成分股名單<b>下載失敗，目前用的是內建後備名單</b>，可能不是最新（失敗原因：${esc((ns.errors || []).join("；"))}）。Nasdaq-100 與合併馬群的陣容可能因此與實際不同。</li>`
    : ns.source === "cache" ? `<li class="warn">⚠️ Nasdaq-100 名單本次更新失敗，沿用 ${esc(ns.fetched_at || "舊")} 的快取名單。</li>`
    : `<li>Nasdaq-100 成分股名單來自 ${esc(ns.source)}（${esc(ns.fetched_at)}，共 ${ns.count} 檔）。</li>`;
  $("truth").innerHTML = `<summary>🔎 資料來源與真實性說明（點開）</summary><ul>
    <li>股價：Yahoo Finance 日收盤價（還原股利與分割），每日由 GitHub Actions 更新；本頁資料截至 <b>${esc(D.asof)}</b>。與看盤網站的數字可能因「是否還原股利」「期間起訖日」有小差異（本頁以月曆計：終點日往前推 ${race.months} 個月後最近的交易日為起跑日）。</li>
    <li>S&amp;P 500 成分股名單來自維基百科的現任成分股。${ndxWarn}</li>
    <li>本賽事納入 ${cv.with_prices} / ${cv.pool_size} 檔（起跑與終點都有報價的才納入${cv.missing.length ? "；無報價：" + esc(cv.missing.join("、")) : ""}）。</li>
    <li>馬名、毛色、花紋與「靈感」說明是創作（參考公司 logo 配色的藝術設計），不是公司官方資訊；其餘數字（漲幅、名次、近績、跑法、能力）都由上述資料計算而來。</li></ul>`;
}

function renderMethod() {
  const kf = D.key_factors, v = race.validation, wt = Object.fromEntries(race.weights.map(w => [w.id, w.w]));
  const verdict = v.n >= 3
    ? `<li><b>歷史回測（樣本內）</b>：用同一方法重跑過去 ${v.n} 場互不重疊的${DIST_NAME[dist]}賽（${v.first} ~ ${v.last}），預測名次與實際名次的平均等級相關為 <b>${v.mean_rho >= 0 ? "+" : ""}${v.mean_rho}</b>（t=${v.t}；0＝沒有預測力、+1＝完全準確）；◎本命平均實際名次 <b>${v.top1_avg_rank}</b>、預測前三名平均實際名次 <b>${v.top3_avg_rank}</b>（隨機亂猜約 5.5）。`
      + `<br><span class="warn">注意：①五項參數是用同一段歷史挑的，屬樣本內結果，樣本外會更差；②名單用現任成分股，有存活者偏差；③馬群是事後漲幅前 10 名，其中波動大的股票容易衝到最前面，能力指數會因此偏愛高波動股。請當成遊戲參考，不是投資建議。</span></li>`
    : `<li>歷史資料不足以回測。</li>`;
  $("method").innerHTML = `<summary>🔮 賽前預測是怎麼算的（點開/收合）</summary><ol>
    <li><b>只看起跑日 ${race.start} 以前的資料</b>：對 ${POOL_NAME[pool]}所有有報價的成分股，各自算出下列五項參數。</li>
    <li><b>全部統一成「越高越好」</b>：歷史統計上與未來漲幅呈負相關的參數，已改用<b>反向</b>定義（例如「距52週高點回檔幅度」＝跌得越深數值越大），所以每一項分數越高都代表越有利。</li>
    <li>每項參數換成在整個馬群中的<b>百分位（0–100，100＝最強）</b>，就是卡片上的能力長條。</li>
    <li><b>能力指數＝五項百分位的加權平均</b>，權重依該參數在${DIST_NAME[dist]}賽程的歷史 IC（與未來報酬的相關性）決定：${kf.map(f => `${esc(f.label)} ${(wt[f.id] * 100).toFixed(0)}%`).join("、")}。缺資料的參數不計入並重新分配權重。</li>
    <li><b>預測名次＝能力指數由高到低排序</b>，◎○▲△△ 標示前五名；賽後與實際漲幅名次比較（下方「預測差」：▲表示實際跑得比預測好）。</li>
    ${verdict}</ol>
    <table><thead><tr><th>參數</th><th>類別</th><th>1M IC</th><th>3M IC</th><th>6M IC</th><th>顯著性(t, 3M)</th></tr></thead><tbody>${kf.map(f =>
      `<tr><td>${esc(f.label)}${f.reversed ? "（反向）" : ""}</td><td>${f.group}</td><td>${f["1m"].ic.toFixed(3)}</td><td>${f["3m"].ic.toFixed(3)}</td><td>${f["6m"].ic.toFixed(3)}</td><td>${f["3m"].t.toFixed(1)}${Math.abs(f["3m"].t) >= 2 ? " ✓" : ""}</td></tr>`).join("")}</tbody></table>
    <p class="muted">IC＝參數與未來報酬的逐月等級相關（${D.study.period[0]}～${D.study.period[1]}，${D.study.universe_size} 檔）。✓＝t 值≥2。相關性普遍很弱（約 0.01–0.06），多數參數統計上並不顯著；美股沒有免費的法人籌碼資料，籌碼面以量價資金流向代替，本次研究中未入選。完整 12 項比較見 <code>data/key_factors.json</code>。</p>`;
}

function renderCards() {
  const kf = D.key_factors;
  $("cards").innerHTML = race.horses.map(h => {
    const form = h.form.map(r => `<span class="chip ${r && r <= 3 ? "g" + r : ""}">${r ?? "–"}</span>`).join("");
    const abil = kf.map(f => { const a = h.ability[f.id];
      return `<span title="${esc(f.label)}：${fmtRaw(f, h.raw[f.id])}">${esc(f.label)}</span><div class="bar"><i style="width:${a ?? 0}%"></i></div><span>${a == null ? "—" : Math.round(a)}</span>`; }).join("");
    return `<div class="card"><div class="cardsp"><div class="sprite live" style="background-image:url(assets/horses/${h.sprite}.png);--spd:${(.5 + h.no * .03).toFixed(2)}s"></div><div class="no" style="background:${COLORS[h.no - 1]}">${h.no}</div></div>
      <div class="head"><span class="tk">${esc(h.horse_zh)}</span><span class="muted">${esc(h.horse_en)}・${esc(h.ticker)}${h.company ? " " + esc(h.company) : ""}・${esc(h.sector)}</span>
        <span class="mark">${h.mark}</span><span class="stars">${"★".repeat(h.stars)}${"☆".repeat(5 - h.stars)}</span><span class="muted">能力指數 ${h.total}</span></div>
      <div class="body">
        <div><div class="lbl">近績（近 4 場同賽程名次，新→舊；在這 10 匹馬之間比）</div><div class="chips">${form}</div>
          <div class="lbl" style="margin-top:8px">跑法</div><span class="badge">${h.style}</span> <span class="muted">${h.style_desc}${h.early_rank != null ? `（前 1/3 段平均第 ${h.early_rank} 名）` : "（資料不足，視為居中）"}</span></div>
        <div><div class="lbl">能力（五大關鍵參數，0–100 為馬群內百分位，越高越好）</div><div class="abil">${abil}</div></div>
      </div>
      <div class="cmt">🎨 花色：${swatch(h)}${esc(h.coat)}${h.inspired_by ? "（靈感：" + esc(h.inspired_by) + "）" : ""}<br>📝 ${esc(h.comment)}</div></div>`;
  }).join("");
}

/* ---------------- race physics + animation ---------------- */
// cubic Catmull-Rom through the daily values -> smooth path instead of day-to-day jumps
function sample(path, t) {
  const n = path.length - 1, i = clamp(Math.floor(t), 0, n - 1), f = clamp(t - i, 0, 1);
  const p0 = path[Math.max(0, i - 1)], p1 = path[i], p2 = path[i + 1], p3 = path[Math.min(n, i + 2)];
  return 0.5 * ((2 * p1) + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
}
const frac = (h, t) => (squash(sample(h.sp, t)) - lo) / span;
// Gaussian-smooth the daily series (edges replicated) so single-day jumps become gentle surges
function smooth(path, sigma) {
  const r = Math.ceil(3 * sigma), ker = []; let sum = 0;
  for (let j = -r; j <= r; j++) { const w = Math.exp(-(j * j) / (2 * sigma * sigma)); ker.push(w); sum += w; }
  return path.map((_, i) => ker.reduce((a, w, j) => a + w * path[clamp(i + j - r, 0, path.length - 1)], 0) / sum);
}

function drawTrack() {
  $("track").innerHTML = race.horses.map(h =>
    `<div class="lane" data-n="${h.no}"><span class="name">${h.no} ${esc(h.horse_zh)} ${esc(h.ticker)}</span>` +
    `<div class="horse"><div class="sprite" style="background-image:url(assets/horses/${h.sprite}.png)"></div><span class="tag" style="background:${COLORS[h.no - 1]}"></span></div></div>`).join("") + '<div class="finish"></div>';
  const sigma = Math.max(1.5, race.days / 25);
  race.horses.forEach(h => { h.sp = smooth(h.path, sigma); });
  lo = 0; let hi = 0;                       // sqrt-compress so one runaway horse doesn't squash the pack
  race.horses.forEach(h => h.sp.forEach(v => { lo = Math.min(lo, squash(v)); hi = Math.max(hi, squash(v)); }));
  span = (hi - lo) || 1;
  $("scrub").max = race.days; $("scrub").step = "any";
  resetPhysics(0);
}

function resetPhysics(t) {
  T = t; shownDay = -1;
  st = race.horses.map((h, i) => ({ pos: frac(h, t), vel: 0, phase: i * 0.37, frame: 6 }));
}

// critically-damped-ish spring: the horse *follows* the target position with inertia, so it accelerates and
// brakes smoothly instead of teleporting; stride rate follows its speed (leaders & surging horses stride faster).
function stepPhysics(dt) {
  const dur = DURATION[$("speed").value];
  const k = 9, c = 2 * Math.sqrt(k) * 1.1;
  race.horses.forEach((h, i) => {
    const s = st[i], target = frac(h, T);
    const sub = 3, d = dt / sub;
    for (let j = 0; j < sub; j++) { s.vel += (k * (target - s.pos) - c * s.vel) * d; s.pos += s.vel * d; }
    const stride = clamp(2.2 + 6 * s.vel * dur + 1.5 * s.pos, 1.1, 5.4);   // strides per second
    s.phase += stride * dt;
    s.frame = Math.floor(s.phase * 6) % 6;
  });
}

function paint(running) {
  const w = $("track").clientWidth, maxX = w - 8 - 150;
  race.horses.forEach((h, i) => {
    const lane = document.querySelector(`.lane[data-n="${h.no}"]`), s = st[i];
    const horse = lane.firstElementChild.nextElementSibling;
    horse.style.transform = `translateX(${8 + clamp(s.pos, -0.02, 1.02) * maxX}px)`;
    horse.firstElementChild.style.backgroundPositionX = (running ? -s.frame * 72 : -6 * 72) + "px";
    horse.lastElementChild.textContent = pct(sample(h.path, T));
  });
  const day = Math.round(T);
  if (day !== shownDay) { shownDay = day; paintBoard(day); }
  $("date").textContent = race.dates[Math.min(day, race.days)];
  $("scrub").value = T;
}

function paintBoard(day) {
  const last = day >= race.days;
  const cur = race.horses.map(h => ({ h, r: h.path[day] })).sort((a, b) => b.r - a.r);
  $("board").querySelector("tbody").innerHTML = cur.map(({ h, r }, i) => {
    const diff = h.pred - (i + 1);
    return `<tr><td>${last && i === 0 ? "🏆" : i + 1}</td><td>${h.no} ${esc(h.horse_zh)} <small class="muted">${esc(h.ticker)}</small> <small class="muted">${h.mark}</small></td>` +
      `<td>$${h.price_start.toFixed(2)}</td><td>${last ? "$" + h.price_end.toFixed(2) : "—"}</td>` +
      `<td class="${cls(r)}">${pct(r)}</td><td>${h.pred}</td>` +
      `<td class="${diff >= 0 ? "up" : "down"}">${last ? (diff > 0 ? "▲" + diff : diff < 0 ? "▼" + -diff : "＝") : ""}</td></tr>`;
  }).join("");
}

function tick(ts) {
  if (!playing) return;
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  // ease-in at the gate and ease-out at the line: playback speed follows a smooth bell, not a constant rate
  const dur = DURATION[$("speed").value], u = T / race.days, ease = 0.55 + 0.9 * Math.sin(Math.PI * clamp(u, 0, 1));
  T = Math.min(race.days, T + dt * (race.days / dur) * ease);
  stepPhysics(dt); paint(true);
  if (T >= race.days) {                      // let the spring settle, then stand
    let settle = 0; const wait = () => { stepPhysics(1 / 60); paint(true); if (++settle < 90) raf = requestAnimationFrame(wait); else stop(); };
    playing = false; raf = requestAnimationFrame(wait); return;
  }
  raf = requestAnimationFrame(tick);
}

function stop() { playing = false; cancelAnimationFrame(raf); $("play").textContent = "▶ 開跑"; if (race) paint(false); }
function play() {
  if (T >= race.days) resetPhysics(0);
  playing = true; lastTs = performance.now(); $("play").textContent = "⏸ 暫停";
  raf = requestAnimationFrame(tick);
}

function select() {
  stop(); segs();
  race = D.pools[pool][dist];
  renderInfo(); renderMethod(); renderCards(); drawTrack(); paint(false);
  try { localStorage.setItem("derby.pool", pool); localStorage.setItem("derby.dist", dist); } catch (e) {}
}

$("pool").onclick = e => { if (e.target.dataset.v) { pool = e.target.dataset.v; select(); } };
$("dist").onclick = e => { if (e.target.dataset.v) { dist = e.target.dataset.v; select(); } };
$("play").onclick = () => playing ? stop() : play();
$("reset").onclick = () => { stop(); resetPhysics(0); paint(false); };
$("scrub").oninput = e => { if (playing) stop(); resetPhysics(+e.target.value); paint(false); };
window.addEventListener("resize", () => race && paint(playing));

fetch("data/derby.json").then(r => r.json()).then(d => {
  D = d; if (!D.pools[pool]) pool = "all"; if (!D.pools[pool][dist]) dist = "3m";
  $("msg").hidden = true; $("app").hidden = false;
  $("foot").textContent = `資料更新至 ${D.asof}（每個交易日由 GitHub Actions 自動更新）。僅供娛樂，非投資建議。`;
  select();
}).catch(e => { $("msg").textContent = "資料載入失敗：" + e.message; });
</script>
</body>
